<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Killer Flies</title>
<!-- App instalable (architecture/app-instalable): se instala en la pantalla de
     inicio del móvil y se abre a pantalla completa, también sin conexión. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" href="assets/iconos/icono-192.png">
<link rel="apple-touch-icon" href="assets/iconos/icono-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Killer Flies">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  /* En el móvil, los toques son del juego: sin zoom, desplazamiento ni selección. */
  html, body, canvas { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
</style>
</head>
<body>
<canvas id="pantalla"></canvas>
<!-- Scripts clásicos (no módulos) para que funcione abriendo el fichero desde el disco. -->
<script src="js/base.js"></script>
<script src="js/graficos.js"></script>
<script src="js/enemigos.js"></script>
<script src="js/formacion.js"></script>
<script src="js/jugador.js"></script>
<script src="js/ataque.js"></script>
<script src="js/powerups.js"></script>
<script src="js/desafio.js"></script>
<script src="js/jefe.js"></script>
<script src="js/combos.js"></script>
<script src="js/marcador.js"></script>
<script src="js/sonidos-datos.js"></script>
<script src="js/sonido.js"></script>
<script src="js/dificultad.js"></script>
<script src="js/perfect.js"></script>
<script src="js/partida.js"></script>
<!-- Partida a dos: conexión entre navegadores (PeerJS) y QR de la sala. -->
<script src="js/lib/peerjs.min.js"></script>
<script src="js/lib/qrcode.js"></script>
<script src="js/red.js"></script>
<script src="js/pausa.js"></script>
<script src="js/vibracion.js"></script>
<script src="js/instalable.js"></script>
<script>KF.iniciar();</script>
</body>
</html>
