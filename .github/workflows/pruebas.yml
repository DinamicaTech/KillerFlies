name: Pruebas
# Pruebas automáticas del juego: en cada pull request, en cada push a main,
# una vez por semana y a petición.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app-instalable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: El juego se puede jugar sin conexión (architecture/app-instalable)
        run: node tools/comprobar-instalable.mjs
  dificultad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Niveles de dificultad EASY, NORMAL y HARD (partida/dificultad)
        run: node tools/comprobar-dificultad.mjs
  ajustes-sonido:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Volumen de la música y de los sonidos en la pausa (sonido/ajustes-sonido)
        run: node tools/comprobar-sonido.mjs
  empezar-tras-perfect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empezar tras un perfect (partida/empezar-tras-perfect)
        run: node tools/comprobar-perfect.mjs
  hall-of-fame:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hall of fame al acabar la partida (marcador/hall-of-fame)
        run: node tools/comprobar-salon-fama.mjs
